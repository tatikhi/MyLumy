<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care & Beauty — Твой Уход</title>
    <!-- Canvas-confetti для салюта из сердечек -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            /* 1. Nude & Silk (по умолчанию) */
            --bg-main: #F9F6F0;
            --surface: #FFFFFF;
            --text-primary: #4A3E3D;
            --text-secondary: #968583;
            --accent-main: #C49A82;
            --accent-grad: linear-gradient(135deg, #D8B4A0 0%, #B0836B 100%);
            --accent-light: #F4ECE6;
            --border-color: #EFE8DE;
            --shadow-soft: 0 12px 36px rgba(196, 154, 130, 0.12);
            --icon-inactive: #D0C6BE;
        }

        /* 2. Eucalyptus & Mint */
        body[data-theme="mint"] {
            --bg-main: #F2F6F5;
            --surface: #FFFFFF;
            --text-primary: #2A3B37;
            --text-secondary: #6B8782;
            --accent-main: #5B8A82;
            --accent-grad: linear-gradient(135deg, #709F97 0%, #48756D 100%);
            --accent-light: #E7F0EE;
            --border-color: #E1ECE9;
            --shadow-soft: 0 12px 36px rgba(91, 138, 130, 0.12);
            --icon-inactive: #B8C9C5;
        }

        /* 3. Blush Lavender */
        body[data-theme="lavender"] {
            --bg-main: #F7F5F9;
            --surface: #FFFFFF;
            --text-primary: #3B3342;
            --text-secondary: #83788C;
            --accent-main: #8B789D;
            --accent-grad: linear-gradient(135deg, #A28FB5 0%, #756287 100%);
            --accent-light: #EFECF3;
            --border-color: #EAE4EF;
            --shadow-soft: 0 12px 36px rgba(139, 120, 157, 0.12);
            --icon-inactive: #CBBFCF;
        }

        /* 4. Sage & Spa */
        body[data-theme="sage"] {
            --bg-main: #F4F6F4;
            --surface: #FFFFFF;
            --text-primary: #2C3A2E;
            --text-secondary: #607062;
            --accent-main: #3A4D39;
            --accent-grad: linear-gradient(135deg, #526E51 0%, #2A3829 100%);
            --accent-light: #ECEFEA;
            --border-color: #E0E5E0;
            --shadow-soft: 0 12px 36px rgba(58, 77, 57, 0.12);
            --icon-inactive: #B5C2B6;
        }

        /* 5. Midnight Calm */
        body[data-theme="midnight"] {
            --bg-main: #1A1F2C;
            --surface: #242A3B;
            --text-primary: #F0F3F9;
            --text-secondary: #9DA8C2;
            --accent-main: #D4A373;
            --accent-grad: linear-gradient(135deg, #E0B384 0%, #B58455 100%);
            --accent-light: #2D354A;
            --border-color: #323B52;
            --shadow-soft: 0 12px 36px rgba(0, 0, 0, 0.45);
            --icon-inactive: #434D66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .theme-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--surface);
            box-shadow: 0 0 0 1px var(--border-color);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .theme-dot:hover {
            transform: scale(1.2);
        }

        .theme-dot.auto-dot {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-settings {
            background: var(--surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            white-space: nowrap;
        }

        /* Недельный и Месячный трекер прогресса с SVG иконками */
        .streak-card {
            background: var(--surface);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .streak-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hearts-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            margin-bottom: 12px;
        }

        .heart-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .svg-icon {
            width: 22px;
            height: 22px;
            fill: var(--icon-inactive);
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .heart-item.active .svg-icon {
            fill: var(--accent-main);
            transform: scale(1.15);
        }

        .heart-day {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Трекер 4 недель (звёздочки SVG) */
        .weeks-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .star-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .star-svg {
            width: 16px;
            height: 16px;
            fill: var(--icon-inactive);
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .star-item.active .star-svg {
            fill: var(--accent-main);
            transform: scale(1.2);
        }

        .main-card {
            background: var(--surface);
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
        }

        .tod-switch {
            display: flex;
            background: var(--accent-light);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tod-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            transition: all 0.2s ease;
        }

        .tod-btn.active {
            background: var(--surface);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .routine-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .routine-item {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent-main);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .item-tag {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Самостоятельный разделительный блок пауз между карточками */
        .pause-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--accent-light);
            border: 1px dashed var(--accent-main);
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-main);
            margin: -2px 0;
            align-self: center;
            width: 90%;
            text-align: center;
        }

        .expiry-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-green { background-color: #2ECC71; }
        .dot-orange { background-color: #E67E22; }
        .dot-red { background-color: #E74C3C; }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--accent-grad);
            color: #FFF;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-card {
            background: var(--surface);
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .days-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .day-chip {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            font-size: 12px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .day-chip.active {
            background: var(--accent-main);
            color: #FFF;
            border-color: var(--accent-main);
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-add-toggle {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px dashed var(--accent-main);
            background: var(--accent-light);
            color: var(--accent-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .product-manage-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--bg-main);
            font-size: 13px;
        }

        .manage-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .manage-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .manage-edit {
            cursor: pointer;
            font-size: 13px;
            opacity: 0.8;
        }

        .manage-del {
            color: #E74C3C;
            cursor: pointer;
            font-weight: bold;
            padding: 2px 4px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .toggle-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-main);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo">Care & Beauty</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div class="theme-selector">
                <div class="theme-dot auto-dot" onclick="setTheme('auto')" title="Тема как на устройстве">📱</div>
                <div class="theme-dot" style="background: #C49A82;" onclick="setTheme('nude')" title="Nude & Silk"></div>
                <div class="theme-dot" style="background: #5B8A82;" onclick="setTheme('mint')" title="Eucalyptus & Mint"></div>
                <div class="theme-dot" style="background: #8B789D;" onclick="setTheme('lavender')" title="Blush Lavender"></div>
                <div class="theme-dot" style="background: #3A4D39;" onclick="setTheme('sage')" title="Sage & Spa"></div>
                <div class="theme-dot" style="background: #242A3B;" onclick="setTheme('midnight')" title="Midnight Calm"></div>
            </div>
            <button class="btn-settings" onclick="openSettings()">⚙️ Настройки</button>
        </div>
    </div>

    <!-- Недельный и Месячный трекер прогресса с SVG иконками -->
    <div class="streak-card">
        <div class="streak-title">Люби себя каждый день 💖</div>
        <div class="hearts-container" id="heartsContainer">
            <!-- ПН = 1, ВТ = 2, СР = 3, ЧТ = 4, ПТ = 5, СБ = 6, ВС = 0 -->
            <div class="heart-item" id="heart-1">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="heart-day">ПН</span>
            </div>
            <div class="heart-item" id="heart-2">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="heart-day">ВТ</span>
            </div>
            <div class="heart-item" id="heart-3">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="heart-day">СР</span>
            </div>
            <div class="heart-item" id="heart-4">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="heart-day">ЧТ</span>
            </div>
            <div class="heart-item" id="heart-5">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="heart-day">ПТ</span>
            </div>
            <div class="heart-item" id="heart-6">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="heart-day">СБ</span>
            </div>
            <div class="heart-item" id="heart-0">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="heart-day">ВС</span>
            </div>
        </div>

        <!-- Звёздочки 4 недель месяца (SVG) -->
        <div class="weeks-container">
            <div class="star-item" id="star-1">
                <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                1 нед.
            </div>
            <div class="star-item" id="star-2">
                <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                2 нед.
            </div>
            <div class="star-item" id="star-3">
                <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                3 нед.
            </div>
            <div class="star-item" id="star-4">
                <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                4 нед.
            </div>
        </div>
    </div>

    <div class="main-card">
        <div class="tod-switch">
            <button class="tod-btn active" id="btnMorning" onclick="switchTOD('morning')">☀️ Утренний уход</button>
            <button class="tod-btn" id="btnEvening" onclick="switchTOD('evening')">🌙 Вечерний уход</button>
        </div>

        <div class="card-header">
            <h2 id="routineTitle">☀️ Утренний уход</h2>
            <p id="routineSub">Индивидуальная программа на сегодня</p>
        </div>

        <div class="routine-list" id="routineContainer"></div>

        <button class="btn-action" onclick="completeRoutine()">✨ Всё сделано</button>
    </div>

    <!-- Модальное окно настроек "Мои средства" -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-title">Мои средства</div>
            
            <div class="product-manage-list" id="manageList"></div>

            <button class="btn-add-toggle" id="btnAddToggle" onclick="showForm()">+ Добавить средство</button>

            <!-- По умолчанию скрытая форма добавления / редактирования -->
            <div id="productFormContainer" style="display: none; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <div class="modal-title" id="formModalTitle" style="font-size: 15px;">Новое средство</div>
                <input type="hidden" id="editProductId" value="">

                <div class="form-group">
                    <label>Название средства</label>
                    <input type="text" id="pName" class="input-control" placeholder="Напр. Retiderm 0.25 или Пенка">
                </div>

                <div class="form-group">
                    <label>Тип / Этап ухода</label>
                    <select id="pType" class="input-control">
                        <option value="Очищение">Очищение</option>
                        <option value="Тонизирование">Тонизирование</option>
                        <option value="Активы">Активы</option>
                        <option value="Уход за глазами">Уход за глазами</option>
                        <option value="Питание / Увлажнение">Питание / Увлажнение</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Время суток</label>
                    <select id="pTOD" class="input-control">
                        <option value="both">И утро, и вечер</option>
                        <option value="morning">Только утро</option>
                        <option value="evening">Только вечер</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Частота применения</label>
                    <select id="pFreqType" class="input-control" onchange="toggleFreqDays()">
                        <option value="daily">Ежедневно</option>
                        <option value="custom">Выбранные дни недели</option>
                    </select>
                    <div class="days-picker" id="daysPicker" style="display: none;">
                        <div class="day-chip" data-day="1" onclick="toggleDayChip(this)">Пн</div>
                        <div class="day-chip" data-day="2" onclick="toggleDayChip(this)">Вт</div>
                        <div class="day-chip" data-day="3" onclick="toggleDayChip(this)">Ср</div>
                        <div class="day-chip" data-day="4" onclick="toggleDayChip(this)">Чт</div>
                        <div class="day-chip" data-day="5" onclick="toggleDayChip(this)">Пт</div>
                        <div class="day-chip" data-day="6" onclick="toggleDayChip(this)">Сб</div>
                        <div class="day-chip" data-day="0" onclick="toggleDayChip(this)">Вс</div>
                    </div>
                </div>

                <!-- Настройки пауз ДО и ПОСЛЕ нанесения -->
                <div class="form-group">
                    <div class="toggle-container">
                        <label for="pPauseToggle" style="cursor: pointer; margin: 0; font-size: 13px; font-weight: 600;">⏱️ Включить паузу/выдержку для средства</label>
                        <input type="checkbox" id="pPauseToggle" class="toggle-checkbox" onchange="togglePauseInputs()">
                    </div>
                    <div id="pauseOptionsContainer" style="display: none; margin-top: 8px; background: var(--bg-main); padding: 10px; border-radius: 12px;">
                        <div style="margin-bottom: 8px;">
                            <label style="font-size: 11px; font-weight: 600; color: var(--text-secondary);">Пауза ДО применения (минут)</label>
                            <input type="number" id="pPauseBefore" class="input-control" placeholder="Напр. 15 (после умывания)">
                        </div>
                        <div>
                            <label style="font-size: 11px; font-weight: 600; color: var(--text-secondary);">Пауза ПОСЛЕ применения (минут)</label>
                            <input type="number" id="pPauseAfter" class="input-control" placeholder="Напр. 15 (перед кремом)">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Дата вскрытия / Начало использования</label>
                    <input type="date" id="pOpenDate" class="input-control">
                </div>

                <div class="form-group">
                    <label>Срок годности (Дата окончания)</label>
                    <input type="date" id="pExpDate" class="input-control">
                </div>

                <button class="btn-action" style="margin-top: 8px;" onclick="saveProduct()">Сохранить средство</button>
                <button class="btn-secondary" onclick="hideForm()">Отмена</button>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">

            <div class="toggle-container">
                <label for="confettiToggle" style="font-size: 13px; font-weight: 500; cursor: pointer;">
                    💖 Праздничный салют при завершении недели
                </label>
                <input type="checkbox" id="confettiToggle" class="toggle-checkbox" onchange="toggleConfettiPref(this)">
            </div>

            <button class="btn-secondary" onclick="closeSettings()">Закрыть</button>
        </div>
    </div>

    <script>
        const typeOrder = {
            "Очищение": 1,
            "Тонизирование": 2,
            "Активы": 3,
            "Уход за глазами": 4,
            "Питание / Увлажнение": 5
        };

        let products = JSON.parse(localStorage.getItem('cb_custom_products')) || [];
        let currentTOD = 'morning';
        let enableConfetti = JSON.parse(localStorage.getItem('cb_enable_confetti')) ?? true;
        
        let completedLog = JSON.parse(localStorage.getItem('cb_completed_log')) || {};
        let completedWeeksCount = JSON.parse(localStorage.getItem('cb_completed_weeks')) || 0;

        document.getElementById('confettiToggle').checked = enableConfetti;

        // Логика установки и автоопределения системной темы устройства
        function setTheme(theme) {
            if (theme === 'auto') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const targetTheme = isDark ? 'midnight' : 'nude';
                document.body.setAttribute('data-theme', targetTheme);
                localStorage.setItem('cb_theme', 'auto');
            } else {
                document.body.setAttribute('data-theme', theme);
                localStorage.setItem('cb_theme', theme);
            }
        }

        // Слушатель автоматического изменения темы устройства
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (localStorage.getItem('cb_theme') === 'auto') {
                setTheme('auto');
            }
        });

        setTheme(localStorage.getItem('cb_theme') || 'auto');

        function toggleConfettiPref(el) {
            enableConfetti = el.checked;
            localStorage.setItem('cb_enable_confetti', JSON.stringify(enableConfetti));
        }

        function switchTOD(tod) {
            currentTOD = tod;
            document.getElementById('btnMorning').classList.toggle('active', tod === 'morning');
            document.getElementById('btnEvening').classList.toggle('active', tod === 'evening');
            document.getElementById('routineTitle').innerText = tod === 'morning' ? '☀️ Утренний уход' : '🌙 Вечерний уход';
            renderRoutine();
        }

        function getStartOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function renderStreak() {
            const now = new Date();
            const monday = getStartOfWeek(now);
            
            const daysMap = [1, 2, 3, 4, 5, 6, 0];
            let thisWeekCompletedDays = 0;

            daysMap.forEach((dayNum, index) => {
                const currentDayDate = new Date(monday);
                currentDayDate.setDate(monday.getDate() + index);
                const dateKey = formatDateKey(currentDayDate);

                const dayLog = completedLog[dateKey] || {};
                const isFullDayDone = dayLog.morning && dayLog.evening;

                const heartEl = document.getElementById(`heart-${dayNum}`);
                if (heartEl) {
                    if (isFullDayDone) {
                        heartEl.classList.add('active');
                        thisWeekCompletedDays++;
                    } else {
                        heartEl.classList.remove('active');
                    }
                }
            });

            for (let w = 1; w <= 4; w++) {
                const starEl = document.getElementById(`star-${w}`);
                if (starEl) {
                    if (w <= completedWeeksCount) {
                        starEl.classList.add('active');
                    } else {
                        starEl.classList.remove('active');
                    }
                }
            }
        }

        function renderRoutine() {
            renderStreak();
            const container = document.getElementById('routineContainer');
            container.innerHTML = '';

            const today = new Date();
            const todayDayOfWeek = today.getDay();

            let activeProducts = products.filter(p => {
                const matchTOD = p.tod === 'both' || p.tod === currentTOD;
                let matchDay = true;

                if (p.freqType === 'custom') {
                    matchDay = Array.isArray(p.days) && p.days.includes(todayDayOfWeek);
                }

                return matchTOD && matchDay;
            });

            activeProducts.sort((a, b) => {
                const orderA = typeOrder[a.type] || 99;
                const orderB = typeOrder[b.type] || 99;
                return orderA - orderB;
            });

            if (activeProducts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        У вас пока нет средств на это время суток или сегодня день отдыха.<br>
                        Добавьте баночки в <b>⚙️ Настройках</b>.
                    </div>
                `;
                return;
            }

            activeProducts.forEach((item, index) => {
                const dotsHtml = calcExpiryDots(item.openDate, item.expDate);

                // Отрисовка паузы ДО как самостоятельного разделителя
                if (item.hasPause && item.pauseBefore) {
                    container.innerHTML += `
                        <div class="pause-divider">
                            ⏱️ Пауза: ${item.pauseBefore} минут
                        </div>
                    `;
                }

                // Карточка самого средства
                container.innerHTML += `
                    <div class="routine-item">
                        <div class="item-left">
                            <div class="item-num">${index + 1}</div>
                            <div class="item-details">
                                <span class="item-name">${item.name}</span>
                                <span class="item-tag">${item.type}</span>
                            </div>
                        </div>
                        <div class="expiry-dots">${dotsHtml}</div>
                    </div>
                `;

                // Отрисовка паузы ПОСЛЕ как самостоятельного разделителя
                if (item.hasPause && item.pauseAfter) {
                    container.innerHTML += `
                        <div class="pause-divider">
                            ⏱️ Пауза: ${item.pauseAfter} минут
                        </div>
                    `;
                }
            });
        }

        function calcExpiryDots(openDateStr, expDateStr) {
            if (!expDateStr) return '<div class="dot dot-green"></div><div class="dot dot-green"></div><div class="dot dot-green"></div>';

            const now = new Date();
            const expDate = new Date(expDateStr);
            const openDate = openDateStr ? new Date(openDateStr) : new Date(now.getFullYear(), 0, 1);

            const totalDuration = expDate - openDate;
            const remainingDuration = expDate - now;

            if (totalDuration <= 0 || remainingDuration <= 0) {
                return '<div class="dot dot-red"></div>';
            }

            const ratio = remainingDuration / totalDuration;

            if (ratio > 0.3) {
                return '<div class="dot dot-green"></div><div class="dot dot-green"></div><div class="dot dot-green"></div>';
            } else if (ratio >= 0.1) {
                return '<div class="dot dot-orange"></div><div class="dot dot-orange"></div>';
            } else {
                return '<div class="dot dot-red"></div>';
            }
        }

        function completeRoutine() {
            const todayStr = formatDateKey(new Date());
            
            if (!completedLog[todayStr]) {
                completedLog[todayStr] = {};
            }

            completedLog[todayStr][currentTOD] = true;
            localStorage.setItem('cb_completed_log', JSON.stringify(completedLog));

            const now = new Date();
            const monday = getStartOfWeek(now);
            let daysThisWeek = 0;

            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                const dKey = formatDateKey(d);
                if (completedLog[dKey] && completedLog[dKey].morning && completedLog[dKey].evening) {
                    daysThisWeek++;
                }
            }

            if (daysThisWeek === 7) {
                if (enableConfetti && typeof confetti === 'function') {
                    const heartScalar = 2;
                    const heartShape = confetti.shapeFromText({ text: '💖', scalar: heartScalar });

                    confetti({
                        shapes: [heartShape],
                        scalar: heartScalar,
                        particleCount: 50,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }

                if (completedWeeksCount < 4) {
                    completedWeeksCount++;
                    localStorage.setItem('cb_completed_weeks', JSON.stringify(completedWeeksCount));
                }

                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    delete completedLog[formatDateKey(d)];
                }
                localStorage.setItem('cb_completed_log', JSON.stringify(completedLog));
            }

            if (currentTOD === 'morning') {
                switchTOD('evening');
            } else {
                switchTOD('morning');
            }
        }

        /* Modal & Form Logic */
        function openSettings() {
            renderManageList();
            hideForm();
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
            resetForm();
            renderRoutine();
        }

        function showForm() {
            document.getElementById('productFormContainer').style.display = 'block';
            document.getElementById('btnAddToggle').style.display = 'none';
        }

        function hideForm() {
            document.getElementById('productFormContainer').style.display = 'none';
            document.getElementById('btnAddToggle').style.display = 'block';
            resetForm();
        }

        function toggleFreqDays() {
            const val = document.getElementById('pFreqType').value;
            document.getElementById('daysPicker').style.display = val === 'custom' ? 'flex' : 'none';
        }

        function togglePauseInputs() {
            const checked = document.getElementById('pPauseToggle').checked;
            document.getElementById('pauseOptionsContainer').style.display = checked ? 'block' : 'none';
        }

        function toggleDayChip(el) {
            el.classList.toggle('active');
        }

        function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            const type = document.getElementById('pType').value;
            const tod = document.getElementById('pTOD').value;
            const freqType = document.getElementById('pFreqType').value;
            const hasPause = document.getElementById('pPauseToggle').checked;
            const pauseBefore = document.getElementById('pPauseBefore').value;
            const pauseAfter = document.getElementById('pPauseAfter').value;
            const openDate = document.getElementById('pOpenDate').value;
            const expDate = document.getElementById('pExpDate').value;
            const editId = document.getElementById('editProductId').value;

            if (!name) {
                alert('Пожалуйста, введите название средства.');
                return;
            }

            let days = [];
            if (freqType === 'custom') {
                document.querySelectorAll('.day-chip.active').forEach(chip => {
                    days.push(parseInt(chip.getAttribute('data-day')));
                });
            }

            if (editId) {
                const idx = products.findIndex(p => p.id == editId);
                if (idx !== -1) {
                    products[idx] = {
                        id: Number(editId),
                        name,
                        type,
                        tod,
                        freqType,
                        days,
                        hasPause,
                        pauseBefore: hasPause ? pauseBefore : null,
                        pauseAfter: hasPause ? pauseAfter : null,
                        openDate,
                        expDate
                    };
                }
            } else {
                products.push({
                    id: Date.now(),
                    name,
                    type,
                    tod,
                    freqType,
                    days,
                    hasPause,
                    pauseBefore: hasPause ? pauseBefore : null,
                    pauseAfter: hasPause ? pauseAfter : null,
                    openDate,
                    expDate
                });
            }

            localStorage.setItem('cb_custom_products', JSON.stringify(products));
            renderManageList();
            hideForm();
        }

        function editProduct(id) {
            const item = products.find(p => p.id == id);
            if (!item) return;

            showForm();

            document.getElementById('editProductId').value = item.id;
            document.getElementById('pName').value = item.name;
            document.getElementById('pType').value = item.type;
            document.getElementById('pTOD').value = item.tod;
            document.getElementById('pFreqType').value = item.freqType;
            document.getElementById('pPauseToggle').checked = !!item.hasPause;
            document.getElementById('pPauseBefore').value = item.pauseBefore || '';
            document.getElementById('pPauseAfter').value = item.pauseAfter || '';
            document.getElementById('pOpenDate').value = item.openDate || '';
            document.getElementById('pExpDate').value = item.expDate || '';

            toggleFreqDays();
            togglePauseInputs();

            document.querySelectorAll('.day-chip').forEach(chip => {
                const day = parseInt(chip.getAttribute('data-day'));
                if (Array.isArray(item.days) && item.days.includes(day)) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            document.getElementById('formModalTitle').innerText = '✏️ Редактировать средство';
        }

        function resetForm() {
            document.getElementById('editProductId').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pType').value = 'Очищение';
            document.getElementById('pTOD').value = 'both';
            document.getElementById('pFreqType').value = 'daily';
            document.getElementById('pPauseToggle').checked = false;
            document.getElementById('pPauseBefore').value = '';
            document.getElementById('pPauseAfter').value = '';
            document.getElementById('pOpenDate').value = '';
            document.getElementById('pExpDate').value = '';
            document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
            toggleFreqDays();
            togglePauseInputs();

            document.getElementById('formModalTitle').innerText = 'Новое средство';
        }

        function renderManageList() {
            const container = document.getElementById('manageList');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<div style="font-size: 13px; color: var(--text-secondary); text-align: center; padding: 10px;">Список пуст. Нажмите «+ Добавить средство».</div>';
                return;
            }

            products.forEach((p) => {
                const dotsHtml = calcExpiryDots(p.openDate, p.expDate);
                container.innerHTML += `
                    <div class="manage-item">
                        <div class="manage-info">
                            <div class="expiry-dots">${dotsHtml}</div>
                            <span><b>${p.name}</b> <span style="font-size: 11px; color: var(--text-secondary);">(${p.type})</span></span>
                        </div>
                        <div class="manage-actions">
                            <span class="manage-edit" onclick="editProduct(${p.id})">✏️</span>
                            <span class="manage-del" onclick="deleteProduct(${p.id})">✕</span>
                        </div>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id != id);
            localStorage.setItem('cb_custom_products', JSON.stringify(products));
            renderManageList();
        }

        renderRoutine();
    </script>
</body>
</html>
