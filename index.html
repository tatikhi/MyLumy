<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care & Beauty — Твой Уход</title>
    <!-- Canvas-confetti library for optional celebratory effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            /* 1. Nude & Silk (по умолчанию) */
            --bg-main: #F9F6F0;
            --surface: #FFFFFF;
            --text-primary: #4A3E3D;
            --text-secondary: #968583;
            --accent-main: #C49A82;
            --accent-grad: linear-gradient(135deg, #D8B4A0 0%, #B0836B 100%);
            --accent-light: #F4ECE6;
            --border-color: #EFE8DE;
            --shadow-soft: 0 12px 36px rgba(196, 154, 130, 0.12);
        }

        /* 2. Eucalyptus & Mint */
        body[data-theme="mint"] {
            --bg-main: #F2F6F5;
            --surface: #FFFFFF;
            --text-primary: #2A3B37;
            --text-secondary: #6B8782;
            --accent-main: #5B8A82;
            --accent-grad: linear-gradient(135deg, #709F97 0%, #48756D 100%);
            --accent-light: #E7F0EE;
            --border-color: #E1ECE9;
            --shadow-soft: 0 12px 36px rgba(91, 138, 130, 0.12);
        }

        /* 3. Blush Lavender */
        body[data-theme="lavender"] {
            --bg-main: #F7F5F9;
            --surface: #FFFFFF;
            --text-primary: #3B3342;
            --text-secondary: #83788C;
            --accent-main: #8B789D;
            --accent-grad: linear-gradient(135deg, #A28FB5 0%, #756287 100%);
            --accent-light: #EFECF3;
            --border-color: #EAE4EF;
            --shadow-soft: 0 12px 36px rgba(139, 120, 157, 0.12);
        }

        /* 4. Velvet Espresso */
        body[data-theme="espresso"] {
            --bg-main: #181514;
            --surface: #24201E;
            --text-primary: #F2ECE9;
            --text-secondary: #9E918C;
            --accent-main: #D4A373;
            --accent-grad: linear-gradient(135deg, #E2B88B 0%, #B88959 100%);
            --accent-light: #332B27;
            --border-color: #36302D;
            --shadow-soft: 0 12px 36px rgba(0, 0, 0, 0.45);
        }

        /* 5. Sage & Spa */
        body[data-theme="sage"] {
            --bg-main: #F4F6F4;
            --surface: #FFFFFF;
            --text-primary: #2C3A2E;
            --text-secondary: #607062;
            --accent-main: #3A4D39;
            --accent-grad: linear-gradient(135deg, #526E51 0%, #2A3829 100%);
            --accent-light: #ECEFEA;
            --border-color: #E0E5E0;
            --shadow-soft: 0 12px 36px rgba(58, 77, 57, 0.12);
        }

        /* 6. Berry & Velvet */
        body[data-theme="berry"] {
            --bg-main: #FAF0F2;
            --surface: #FFFFFF;
            --text-primary: #3B1C24;
            --text-secondary: #7A4D58;
            --accent-main: #6B2337;
            --accent-grad: linear-gradient(135deg, #8C324B 0%, #4D1826 100%);
            --accent-light: #F7E6EB;
            --border-color: #EED5DC;
            --shadow-soft: 0 12px 36px rgba(107, 35, 55, 0.12);
        }

        /* 7. Midnight Calm */
        body[data-theme="midnight"] {
            --bg-main: #1A1F2C;
            --surface: #242A3B;
            --text-primary: #F0F3F9;
            --text-secondary: #9DA8C2;
            --accent-main: #D4A373;
            --accent-grad: linear-gradient(135deg, #E0B384 0%, #B58455 100%);
            --accent-light: #2D354A;
            --border-color: #323B52;
            --shadow-soft: 0 12px 36px rgba(0, 0, 0, 0.45);
        }

        /* 8. Blush & Nude */
        body[data-theme="blush"] {
            --bg-main: #FDF6F6;
            --surface: #FFFFFF;
            --text-primary: #4A3B3C;
            --text-secondary: #9E8284;
            --accent-main: #D9A0A0;
            --accent-grad: linear-gradient(135deg, #E8B4B4 0%, #C48888 100%);
            --accent-light: #FBF0F0;
            --border-color: #F2E1E1;
            --shadow-soft: 0 12px 36px rgba(217, 160, 160, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 220px;
            justify-content: flex-end;
        }

        .theme-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--surface);
            box-shadow: 0 0 0 1px var(--border-color);
            transition: transform 0.2s;
        }

        .theme-dot:hover {
            transform: scale(1.25);
        }

        .btn-settings {
            background: var(--surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            white-space: nowrap;
        }

        .main-card {
            background: var(--surface);
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            padding: 28px 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .tod-switch {
            display: flex;
            background: var(--accent-light);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tod-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            transition: all 0.2s ease;
        }

        .tod-btn.active {
            background: var(--surface);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .routine-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .routine-item {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent-main);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .item-tag {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .expiry-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-green { background-color: #2ECC71; }
        .dot-orange { background-color: #E67E22; }
        .dot-red { background-color: #E74C3C; }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--accent-grad);
            color: #FFF;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-card {
            background: var(--surface);
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .days-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .day-chip {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            font-size: 12px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .day-chip.active {
            background: var(--accent-main);
            color: #FFF;
            border-color: var(--accent-main);
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .product-manage-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            max-height: 180px;
            overflow-y: auto;
        }

        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--bg-main);
            font-size: 13px;
        }

        .manage-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .manage-edit {
            cursor: pointer;
            font-size: 13px;
            opacity: 0.8;
        }

        .manage-del {
            color: #E74C3C;
            cursor: pointer;
            font-weight: bold;
            padding: 2px 4px;
        }

        .toggle-switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .toggle-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-main);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo">Care & Beauty</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div class="theme-selector">
                <div class="theme-dot" style="background: #C49A82;" onclick="setTheme('nude')" title="Nude & Silk"></div>
                <div class="theme-dot" style="background: #5B8A82;" onclick="setTheme('mint')" title="Eucalyptus & Mint"></div>
                <div class="theme-dot" style="background: #8B789D;" onclick="setTheme('lavender')" title="Blush Lavender"></div>
                <div class="theme-dot" style="background: #24201E;" onclick="setTheme('espresso')" title="Velvet Espresso"></div>
                <div class="theme-dot" style="background: #3A4D39;" onclick="setTheme('sage')" title="Sage & Spa"></div>
                <div class="theme-dot" style="background: #6B2337;" onclick="setTheme('berry')" title="Berry & Velvet"></div>
                <div class="theme-dot" style="background: #242A3B;" onclick="setTheme('midnight')" title="Midnight Calm"></div>
                <div class="theme-dot" style="background: #D9A0A0;" onclick="setTheme('blush')" title="Blush & Nude"></div>
            </div>
            <button class="btn-settings" onclick="openSettings()">⚙️ Настройки</button>
        </div>
    </div>

    <div class="main-card">
        <div class="tod-switch">
            <button class="tod-btn active" id="btnMorning" onclick="switchTOD('morning')">☀️ Утренний уход</button>
            <button class="tod-btn" id="btnEvening" onclick="switchTOD('evening')">🌙 Вечерний уход</button>
        </div>

        <div class="card-header">
            <h2 id="routineTitle">☀️ Утренний уход</h2>
            <p id="routineSub">Индивидуальная программа на сегодня</p>
        </div>

        <div class="routine-list" id="routineContainer"></div>

        <button class="btn-action" onclick="completeRoutine()">✨ Всё сделано</button>
    </div>

    <!-- Модальное окно настроек и косметички -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-title">⚙️ Настройки и Косметичка</div>
            
            <div style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;">Мои средства:</div>
            <div class="product-manage-list" id="manageList"></div>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">

            <div class="modal-title" id="formModalTitle" style="font-size: 15px;">+ Добавить средство</div>
            <input type="hidden" id="editProductId" value="">

            <div class="form-group">
                <label>Название средства</label>
                <input type="text" id="pName" class="input-control" placeholder="Напр. Retiderm 0.25 или Пенка">
            </div>

            <div class="form-group">
                <label>Тип / Этап ухода</label>
                <select id="pType" class="input-control">
                    <option value="Очищение">Очищение</option>
                    <option value="Тонизирование">Тонизирование</option>
                    <option value="Активы">Активы</option>
                    <option value="Уход за глазами">Уход за глазами</option>
                    <option value="Питание / Увлажнение">Питание / Увлажнение</option>
                </select>
            </div>

            <div class="form-group">
                <label>Время суток</label>
                <select id="pTOD" class="input-control">
                    <option value="both">И утро, и вечер</option>
                    <option value="morning">Только утро</option>
                    <option value="evening">Только вечер</option>
                </select>
            </div>

            <div class="form-group">
                <label>Частота применения</label>
                <select id="pFreqType" class="input-control" onchange="toggleFreqDays()">
                    <option value="daily">Ежедневно</option>
                    <option value="custom">Выбранные дни недели</option>
                </select>
                <div class="days-picker" id="daysPicker" style="display: none;">
                    <div class="day-chip" data-day="1" onclick="toggleDayChip(this)">Пн</div>
                    <div class="day-chip" data-day="2" onclick="toggleDayChip(this)">Вт</div>
                    <div class="day-chip" data-day="3" onclick="toggleDayChip(this)">Ср</div>
                    <div class="day-chip" data-day="4" onclick="toggleDayChip(this)">Чт</div>
                    <div class="day-chip" data-day="5" onclick="toggleDayChip(this)">Пт</div>
                    <div class="day-chip" data-day="6" onclick="toggleDayChip(this)">Сб</div>
                    <div class="day-chip" data-day="0" onclick="toggleDayChip(this)">Вс</div>
                </div>
            </div>

            <div class="form-group">
                <label>Дата вскрытия / Начало использования</label>
                <input type="date" id="pOpenDate" class="input-control">
            </div>

            <div class="form-group">
                <label>Срок годности (Дата окончания)</label>
                <input type="date" id="pExpDate" class="input-control">
            </div>

            <button class="btn-action" style="margin-top: 12px;" onclick="saveProduct()">Сохранить средство</button>
            <button class="btn-secondary" id="btnCancelEdit" style="display: none;" onclick="resetForm()">Отмена редактирования</button>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">

            <div class="toggle-switch-container">
                <label for="confettiToggle" style="font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer;">
                    💖 Праздничные сердечки и конфетти при нажатии «Всё сделано»
                </label>
                <input type="checkbox" id="confettiToggle" class="toggle-checkbox" onchange="toggleConfettiPref(this)">
            </div>

            <button class="btn-secondary" onclick="closeSettings()">Закрыть</button>
        </div>
    </div>

    <script>
        // Иерархия шагов для строгого соблюдения косметологической последовательности
        const typeOrder = {
            "Очищение": 1,
            "Тонизирование": 2,
            "Активы": 3,
            "Уход за глазами": 4,
            "Питание / Увлажнение": 5
        };

        let products = JSON.parse(localStorage.getItem('cb_custom_products')) || [];
        let currentTOD = 'morning';
        let enableConfetti = JSON.parse(localStorage.getItem('cb_enable_confetti')) || false;

        // Инициализация тумблера конфетти
        document.getElementById('confettiToggle').checked = enableConfetti;

        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('cb_theme', theme);
        }
        setTheme(localStorage.getItem('cb_theme') || 'nude');

        function toggleConfettiPref(el) {
            enableConfetti = el.checked;
            localStorage.setItem('cb_enable_confetti', JSON.stringify(enableConfetti));
        }

        function switchTOD(tod) {
            currentTOD = tod;
            document.getElementById('btnMorning').classList.toggle('active', tod === 'morning');
            document.getElementById('btnEvening').classList.toggle('active', tod === 'evening');
            document.getElementById('routineTitle').innerText = tod === 'morning' ? '☀️ Утренний уход' : '🌙 Вечерний уход';
            renderRoutine();
        }

        function renderRoutine() {
            const container = document.getElementById('routineContainer');
            container.innerHTML = '';

            const today = new Date();
            const todayDayOfWeek = today.getDay(); // 0 - Вс, 1 - Пн ...

            // Фильтрация по времени суток и дням недели
            let activeProducts = products.filter(p => {
                const matchTOD = p.tod === 'both' || p.tod === currentTOD;
                let matchDay = true;

                if (p.freqType === 'custom') {
                    matchDay = Array.isArray(p.days) && p.days.includes(todayDayOfWeek);
                }

                return matchTOD && matchDay;
            });

            // Автоматическая сортировка по косметологическим этапам
            activeProducts.sort((a, b) => {
                const orderA = typeOrder[a.type] || 99;
                const orderB = typeOrder[b.type] || 99;
                return orderA - orderB;
            });

            if (activeProducts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        У вас пока нет средств на это время суток или сегодня день отдыха.<br>
                        Добавьте баночки в <b>⚙️ Настройках</b>.
                    </div>
                `;
                return;
            }

            activeProducts.forEach((item, index) => {
                const dotsHtml = calcExpiryDots(item.openDate, item.expDate);
                container.innerHTML += `
                    <div class="routine-item">
                        <div class="item-left">
                            <div class="item-num">${index + 1}</div>
                            <div class="item-details">
                                <span class="item-name">${item.name}</span>
                                <span class="item-tag">${item.type}</span>
                            </div>
                        </div>
                        <div class="expiry-dots">${dotsHtml}</div>
                    </div>
                `;
            });
        }

        function calcExpiryDots(openDateStr, expDateStr) {
            if (!expDateStr) return '<div class="dot dot-green"></div><div class="dot dot-green"></div><div class="dot dot-green"></div>';

            const now = new Date();
            const expDate = new Date(expDateStr);
            const openDate = openDateStr ? new Date(openDateStr) : new Date(now.getFullYear(), 0, 1);

            const totalDuration = expDate - openDate;
            const remainingDuration = expDate - now;

            if (totalDuration <= 0 || remainingDuration <= 0) {
                return '<div class="dot dot-red"></div>';
            }

            const ratio = remainingDuration / totalDuration;

            if (ratio > 0.3) {
                return '<div class="dot dot-green"></div><div class="dot dot-green"></div><div class="dot dot-green"></div>';
            } else if (ratio >= 0.1) {
                return '<div class="dot dot-orange"></div><div class="dot dot-orange"></div>';
            } else {
                return '<div class="dot dot-red"></div>';
            }
        }

        function completeRoutine() {
            // Запуск салюта при активной опции
            if (enableConfetti && typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Переключение на следующий этап без всплывающих окон
            if (currentTOD === 'morning') {
                switchTOD('evening');
            } else {
                switchTOD('morning');
            }
        }

        /* Modal Logic */
        function openSettings() {
            renderManageList();
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
            resetForm();
            renderRoutine();
        }

        function toggleFreqDays() {
            const val = document.getElementById('pFreqType').value;
            document.getElementById('daysPicker').style.display = val === 'custom' ? 'flex' : 'none';
        }

        function toggleDayChip(el) {
            el.classList.toggle('active');
        }

        function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            const type = document.getElementById('pType').value;
            const tod = document.getElementById('pTOD').value;
            const freqType = document.getElementById('pFreqType').value;
            const openDate = document.getElementById('pOpenDate').value;
            const expDate = document.getElementById('pExpDate').value;
            const editId = document.getElementById('editProductId').value;

            if (!name) {
                alert('Пожалуйста, введите название средства.');
                return;
            }

            let days = [];
            if (freqType === 'custom') {
                document.querySelectorAll('.day-chip.active').forEach(chip => {
                    days.push(parseInt(chip.getAttribute('data-day')));
                });
            }

            if (editId) {
                // Редактирование существующего
                const idx = products.findIndex(p => p.id == editId);
                if (idx !== -1) {
                    products[idx] = {
                        id: Number(editId),
                        name,
                        type,
                        tod,
                        freqType,
                        days,
                        openDate,
                        expDate
                    };
                }
            } else {
                // Добавление нового
                products.push({
                    id: Date.now(),
                    name,
                    type,
                    tod,
                    freqType,
                    days,
                    openDate,
                    expDate
                });
            }

            localStorage.setItem('cb_custom_products', JSON.stringify(products));
            resetForm();
            renderManageList();
        }

        function editProduct(id) {
            const item = products.find(p => p.id == id);
            if (!item) return;

            document.getElementById('editProductId').value = item.id;
            document.getElementById('pName').value = item.name;
            document.getElementById('pType').value = item.type;
            document.getElementById('pTOD').value = item.tod;
            document.getElementById('pFreqType').value = item.freqType;
            document.getElementById('pOpenDate').value = item.openDate || '';
            document.getElementById('pExpDate').value = item.expDate || '';

            toggleFreqDays();

            document.querySelectorAll('.day-chip').forEach(chip => {
                const day = parseInt(chip.getAttribute('data-day'));
                if (Array.isArray(item.days) && item.days.includes(day)) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            document.getElementById('formModalTitle').innerText = '✏️ Редактировать средство';
            document.getElementById('btnCancelEdit').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('editProductId').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pType').value = 'Очищение';
            document.getElementById('pTOD').value = 'both';
            document.getElementById('pFreqType').value = 'daily';
            document.getElementById('pOpenDate').value = '';
            document.getElementById('pExpDate').value = '';
            document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
            toggleFreqDays();

            document.getElementById('formModalTitle').innerText = '+ Добавить средство';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        function renderManageList() {
            const container = document.getElementById('manageList');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<div style="font-size: 12px; color: var(--text-secondary);">Список пуст</div>';
                return;
            }

            products.forEach((p) => {
                container.innerHTML += `
                    <div class="manage-item">
                        <span><b>${p.name}</b> (${p.type})</span>
                        <div class="manage-actions">
                            <span class="manage-edit" onclick="editProduct(${p.id})">✏️</span>
                            <span class="manage-del" onclick="deleteProduct(${p.id})">✕</span>
                        </div>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id != id);
            localStorage.setItem('cb_custom_products', JSON.stringify(products));
            renderManageList();
        }

        // Старт
        renderRoutine();
    </script>
</body>
</html>
