                            <span class="category-chevron">▼</span>
                        </button>
                        <div class="category-items-container ${openContainerClass}" id="cat-container-${catIndex}" style="${shouldAutoExpand ? 'max-height: 2000px;' : ''}">
                            ${catItemsHtml}
                        </div>
                    </div>
                `);
            });

            container.innerHTML = htmlBuffer.join('');
            autoExpandCategoryName = null;
        }

        function deleteProduct(id) {
            closeAllPopovers();
            const targetId = Number(id);
            products = products.filter(p => p.id !== targetId);
            safeStorage.setItem('cb_custom_products', JSON.stringify(products));

            if (products.length === 0) {
                safeStorage.removeItem('cb_product_progress');
                safeStorage.removeItem('cb_selected_date');
                safeStorage.removeItem('cb_evening_completed');
                safeStorage.removeItem('cb_install_date');
                productProgress = {};
                switchTOD(getInitialTOD());
            } else {
                renderManageList();
                renderRoutine();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            /* Открытие кастомного календаря при клике на чип даты */
            document.getElementById('currentDateChip').addEventListener('click', openCustomCalendar);
            document.getElementById('btnCloseCal').addEventListener('click', closeCustomCalendar);

            document.getElementById('calPrevMonth').addEventListener('click', () => {
                calCurrentViewDate.setMonth(calCurrentViewDate.getMonth() - 1);
                renderCustomCalendar();
            });

            document.getElementById('calNextMonth').addEventListener('click', () => {
                calCurrentViewDate.setMonth(calCurrentViewDate.getMonth() + 1);
                renderCustomCalendar();
            });

            document.getElementById('themeRow').addEventListener('click', (e) => {
                const themeBtn = e.target.closest('[data-theme]');
                if (themeBtn) {
                    setTheme(themeBtn.getAttribute('data-theme'));
                }
            });

            document.getElementById('btnOpenSettings').addEventListener('click', openSettings);
            document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);
            document.getElementById('btnHeaderClose').addEventListener('click', closeSettings);

            document.getElementById('btnOpenAppSettings').addEventListener('click', openAppSettings);
            document.getElementById('btnCloseAppSettings').addEventListener('click', closeAppSettings);
            document.getElementById('btnAppHeaderClose').addEventListener('click', closeAppSettings);

            document.getElementById('btnAddToggle').addEventListener('click', () => showForm(false));
            document.getElementById('btnScanBarcode').addEventListener('click', startBarcodeScanner);
            document.getElementById('btnCancelScanner').addEventListener('click', stopBarcodeScanner);
            document.getElementById('btnCancelProduct').addEventListener('click', hideForm);
            document.getElementById('btnSaveProduct').addEventListener('click', saveProduct);

            document.getElementById('btnTogglePauseAccordion').addEventListener('click', () => {
                toggleAccordion('pauseAccordionContent', 'pauseAccordionArrow');
            });
            document.getElementById('btnToggleExpiryAccordion').addEventListener('click', () => {
                toggleAccordion('expiryAccordionContent', 'expiryAccordionArrow');
            });

            document.getElementById('btnCopyShareLink').addEventListener('click', copyShareLink);
            document.getElementById('btnExportJson').addEventListener('click', exportJsonFile);
            document.getElementById('btnImportJson').addEventListener('click', () => {
                document.getElementById('jsonFileInput').click();
            });
            document.getElementById('jsonFileInput').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    importJsonFile(e.target.files[0]);
                    e.target.value = '';
                }
            });

            const pNameInput = document.getElementById('pName');
            pNameInput.addEventListener('input', (e) => {
                handleNameInput(e.target.value);
            });

            pNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.target.blur();
                    closeAutocomplete();
                }
            });

            document.getElementById('productFormContainer').addEventListener('click', (e) => {
                if (!e.target.closest('.form-group')) {
                    closeAutocomplete();
                }
                if (!e.target.closest('input, select, textarea, button')) {
                    const activeInput = document.activeElement;
                    if (activeInput && activeInput.tagName === 'INPUT') {
                        activeInput.blur();
                    }
                }
            });

            document.getElementById('typePicker').addEventListener('click', (e) => {
                const btn = e.target.closest('.picker-btn');
                if (btn) {
                    document.querySelectorAll('#typePicker .picker-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            });

            document.getElementById('todPicker').addEventListener('click', (e) => {
                const btn = e.target.closest('.picker-btn');
                if (btn) {
                    btn.classList.toggle('active');
                }
            });

            document.getElementById('freqPicker').addEventListener('click', (e) => {
                const btn = e.target.closest('.picker-btn');
                if (btn) {
                    const freq = btn.getAttribute('data-freq');
                    document.querySelectorAll('#freqPicker .picker-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('pFreqType').value = freq;
                    document.getElementById('daysGroup').style.display = (freq === 'custom') ? 'block' : 'none';
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.product-wrapper-block')) {
                    closeAllPopovers();
                }
            });

            document.getElementById('btnMorning').addEventListener('click', () => {
                const selected = safeStorage.getItem('cb_selected_date');
                const logicalToday = getLogicalTodayStr();
                if (!selected || selected === logicalToday) {
                    safeStorage.removeItem('cb_selected_date');
                }
                switchTOD('morning');
            });

            document.getElementById('btnEvening').addEventListener('click', () => {
                const selected = safeStorage.getItem('cb_selected_date');
                const logicalToday = getLogicalTodayStr();
                if (!selected || selected === logicalToday) {
                    safeStorage.removeItem('cb_selected_date');
                }
                switchTOD('evening');
            });

            document.getElementById('pauseBeforePicker').addEventListener('click', (e) => {
                const btn = e.target.closest('.picker-btn');
                if (btn) applyPauseBefore(btn.getAttribute('data-mins'));
            });

            document.getElementById('pauseAfterPicker').addEventListener('click', (e) => {
                const btn = e.target.closest('.picker-btn');
                if (btn) applyPauseAfter(btn.getAttribute('data-mins'));
            });

            document.getElementById('daysPicker').addEventListener('click', (e) => {
                const chip = e.target.closest('.day-chip');
                if (chip) chip.classList.toggle('active');
            });

            document.getElementById('paoPicker').addEventListener('click', (e) => {
                const chip = e.target.closest('.pao-chip');
                if (chip) {
                    const months = chip.getAttribute('data-months');
                    if (months) applyPAO(months);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeAllPopovers();
                    closeAutocomplete();

                    const modal = document.getElementById('settingsModal');
                    if (modal && modal.style.display === 'flex') closeSettings();

                    const appModal = document.getElementById('appSettingsModal');
                    if (appModal && appModal.style.display === 'flex') closeAppSettings();

                    const calModal = document.getElementById('customCalendarModal');
                    if (calModal && calModal.style.display === 'flex') closeCustomCalendar();
                }
            });

            switchTOD(currentTOD);
        });
    </script>
</body>
</html>
